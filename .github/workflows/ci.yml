name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit + end-to-end tests (offline mock model, no LLM needed)
        run: pytest -q
      - name: Mock red-team run + regression gate
        run: |
          redteam run --mock --defense baseline,full --seeds 1,2 --runs-dir /tmp/mockruns
          redteam judge --mock --defense baseline,full --runs-dir /tmp/mockruns
          redteam gate --defense full --max-asr 0.25 --runs-dir /tmp/mockruns
      - name: Committed results are reproducible from committed transcripts
        run: |
          redteam report > /dev/null
          git diff --exit-code -- results/summary.json results/summary.md
      - name: Regression gate on the committed live-model run
        run: redteam gate --defense full --max-asr 0.10
